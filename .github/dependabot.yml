version: 2

# @rmartz/repo-hygiene is public on npmjs, so Dependabot needs no registry block
# or DEPENDABOT_PACKAGES_TOKEN secret to see new CLI versions. Every npm
# dependency here now comes from the one default registry.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor/patch bumps batched; majors fall out into isolated PRs for review.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      # Daily, not weekly: a new @rmartz/repo-hygiene release is what cuts a new
      # Action release, so this interval bounds how long a CLI fix waits before it
      # can reach consumers. Dev deps ride along but are grouped, so the extra
      # churn is at most one grouped PR per day.
      interval: daily
    commit-message:
      # Production dep bumps (@rmartz/repo-hygiene) get `fix(deps): …`, which
      # semantic-release maps to a patch — cutting the new Action release that
      # ships the CLI bump to consumers. Development deps get `prefix-development`
      # (`chore(deps): …`), which is release-neutral so a tooling bump never tags.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated so a reformatting bump can't hide in a catch-all.
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      # @rmartz/repo-hygiene is the only production dep; its patch/minor bump is
      # what bot-automerge auto-merges and, titled `fix(deps): …`, semantic-release
      # maps to a patch, so the bump cuts a new action release. A major bump falls
      # out to its own PR (not auto-merged) for a human to review.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # conventional-changelog-conventionalcommits@10 requires changelog-writer@9,
      # but @semantic-release/release-notes-generator@14 ships writer@8, so a v10
      # bump breaks the Release job — and that failure only surfaces post-merge (CI
      # is green on the PR), making an automated major a latent release-breaker.
      # Bump this preset's major by hand only when release-notes-generator moves to
      # a writer@9 line; minor/patch (9.x) updates flow normally.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']
