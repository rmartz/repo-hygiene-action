name: 'Repo Hygiene'
description: 'Run the @rmartz/repo-hygiene low-cost CI checks against the calling repository.'
author: 'rmartz'

branding:
  icon: 'check-circle'
  color: 'green'

# A composite action that wraps the @rmartz/repo-hygiene CLI. The consuming job
# checks out its own repository and then runs this action as a step; the CLI
# version is the one pinned in this action's package-lock.json (bumped by
# Dependabot + released as a new action version), so a given action ref installs
# a reproducible check set. See docs/design/integration-contract.md.

inputs:
  checks:
    description: >-
      Space-separated check names to run. Empty (the default) runs the package's
      registry-derived default-on set, so a newly-added default-on check
      auto-joins on the next Dependabot bump of this action with no edit here.
      Pass e.g. "okf docs-links" to opt into repo-specific checks — this becomes
      the exact run list, so include the defaults you still want.
    required: false
    default: ''
  config:
    description: >-
      Path to the .repo-hygiene.yml config, relative to working-directory
      (optional).
    required: false
    default: ''
  node-version:
    description: 'Node.js version to run the checks under.'
    required: false
    default: '22'
  working-directory:
    description: >-
      Directory to scan (the checked-out repository root by default). The config
      path is resolved relative to it.
    required: false
    default: '.'
  token:
    description: >-
      Token used to post per-check commit statuses. Defaults to the workflow
      GITHUB_TOKEN, which posts statuses when the calling job grants
      `statuses: write`. @rmartz/repo-hygiene installs from npmjs with no auth,
      so no token or `packages: read` is needed for the install.
    required: false
    default: ${{ github.token }}
  statuses:
    description: >-
      Post one commit status per check (e.g. "repo-hygiene / okf") so the status
      list shows which check failed. Needs `statuses: write` on the calling job;
      without it the action warns and still reports the overall result. Set to
      "false" to turn it off.
    required: false
    default: 'true'
  status-context:
    description: >-
      Prefix for the per-check status names ("<prefix> / <check>"). Set a
      distinct value when a workflow runs this action more than once.
    required: false
    default: 'repo-hygiene'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    # Install the pinned CLI into this action's own directory, not the consumer
    # workspace — $GITHUB_ACTION_PATH holds this action's package.json, lockfile,
    # and .npmrc (which pins the @rmartz scope to npmjs). The package is public on
    # npmjs, so the install needs no token.
    - name: Install pinned @rmartz/repo-hygiene
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    # Run the checks against the consumer workspace (working-directory). The
    # runner script lives in this action's directory, so its import of
    # @rmartz/repo-hygiene resolves to the copy just installed there. It prints
    # the same annotations and exit code as the CLI, and also posts one commit
    # status per check.
    - name: Run repo-hygiene checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_STATUSES: ${{ inputs.statuses }}
        INPUT_STATUS_CONTEXT: ${{ inputs.status-context }}
        # A pull_request run's github.sha is the synthetic merge commit; statuses
        # must land on the PR head to show in its status list.
        INPUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: node "${GITHUB_ACTION_PATH}/scripts/run-checks.mjs"
