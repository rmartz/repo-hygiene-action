name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per-ref concurrency: a new push to a branch cancels its in-flight run, but main
# is never cancelled (each push to the default branch runs to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      packages: read # npm ci resolves the @rmartz/repo-hygiene production dep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check

  hygiene:
    name: Self-hygiene (dogfood)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      # Dogfood: run this repo's own composite action against its own tree, the
      # exact shape every consumer uses. This validates the action wrapper AND the
      # checks end to end against the CLI version pinned in our lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          checks: conflict-markers action-pins package-pins docs-links okf okf-index md-pairing file-caps
          config: .repo-hygiene.yml
